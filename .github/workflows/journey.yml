name: Update journey

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_journey.py
        env:
          GH_TOKEN: ${{ secrets.JOURNEY_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "journey-bot"
          git config user.email "journey-bot@users.noreply.github.com"
          git add assets/journey/journey.svg
          git diff --staged --quiet || git commit -m "chore: update journey graph" && git push
